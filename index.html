<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار ١ دراسة الحياة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --p1:#7F1D3A; --p2:#B3194A; --p3:#E5386B; --pS:#FFE4EC; --pXS:#FFF5F8;
  --sage:#3F6B1E; --sageL:#E3F2CF; --gold:#E8A33D; --amber:#C77A0A; --amberL:#FFF0D1;
  --ink:#3A0F1F; --mute:#7A4F5C; --bg:#FCF3F5;
  --ok:#15803D; --okL:#DCFCE7; --bad:#DC2626; --badL:#FEE2E2; --cur:#2563EB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
.wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;opacity:.055}
.wm svg{width:62vmin;height:62vmin}
header,main,footer{position:relative;z-index:1}

/* header */
.hdr{background:linear-gradient(135deg,var(--p1),var(--p2) 55%,var(--p3));color:#fff;padding:18px 16px 22px;text-align:center;border-radius:0 0 26px 26px;box-shadow:0 8px 24px rgba(127,29,58,.28)}
.hdr .lg{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.hdr .lg .ic{width:46px;height:46px}
.hdr .lg .wd{height:40px;width:auto}
.attr{font-weight:900;font-size:1.15rem;letter-spacing:.2px}
.attr .ph{direction:ltr;unicode-bidi:isolate;display:inline-block}
.hdr .attr{background:rgba(255,255,255,.16);display:inline-block;padding:3px 14px;border-radius:30px;margin:2px 0 8px}
.hdr .ttl{font-size:1.55rem;font-weight:900;margin:2px 0}
.hdr .sub{font-size:.95rem;opacity:.95;font-weight:500}

/* sticky */
.stk{position:sticky;top:0;z-index:20;background:rgba(252,243,245,.96);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:2px solid var(--pS)}
.stk-in{max-width:720px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:12px}
.tmr{background:linear-gradient(135deg,var(--p2),var(--p1));color:#fff;font-weight:900;border-radius:14px;padding:5px 12px;font-size:1.1rem;white-space:nowrap;box-shadow:0 3px 10px rgba(179,25,74,.3)}
.tmr .t{direction:ltr;unicode-bidi:isolate;display:inline-block}
.tmr.warn{background:linear-gradient(135deg,#F59E0B,#B45309)}
.tmr.crit{background:linear-gradient(135deg,#EF4444,#991B1B);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.prg{flex:1}
.prg-t{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:var(--mute)}
.bar{height:10px;background:var(--pS);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),#7CB342);border-radius:10px;transition:width .35s}

main{max-width:720px;margin:0 auto;padding:16px 14px 30px}
.card{background:#fff;border-radius:20px;padding:18px 16px;box-shadow:0 6px 22px rgba(127,29,58,.10);border:1.5px solid var(--pS)}

/* intro */
.intro{text-align:center}
.intro h2{margin:0 0 4px;color:var(--p1);font-weight:900;font-size:1.45rem}
.intro p{margin:0 0 12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.chip{background:var(--pS);color:var(--p1);font-weight:800;border-radius:30px;padding:5px 14px;font-size:.95rem}
.chip.g{background:var(--sageL);color:var(--sage)}
.chip.a{background:var(--amberL);color:var(--amber)}
.secs{display:grid;gap:7px;margin:0 0 16px;text-align:right}
.secs div{display:flex;justify-content:space-between;align-items:center;border-radius:12px;padding:7px 12px;font-weight:700;color:#fff}
.secs b{background:rgba(255,255,255,.25);border-radius:20px;padding:0 10px}
.big{width:100%;border:none;border-radius:16px;padding:14px;font-size:1.2rem;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--p2),var(--p1));box-shadow:0 6px 16px rgba(179,25,74,.35)}

/* section colors */
.s1{background:linear-gradient(135deg,#B3194A,#7F1D3A)}
.s2{background:linear-gradient(135deg,#5B8C2A,#3F6B1E)}
.s3{background:linear-gradient(135deg,#D97706,#9A5B05)}
.s4{background:linear-gradient(135deg,#0E8A7B,#0B5E55)}
.s5{background:linear-gradient(135deg,#7C3AED,#5B21B6)}
.s6{background:linear-gradient(135deg,#DB2777,#9D174D)}

/* navigator */
.navg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.sq{position:relative;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;color:#fff;border:none;box-shadow:0 2px 5px rgba(0,0,0,.12)}
.sq.no{background:var(--bad)}
.sq.ans{background:var(--ok)}
.sq.cur{background:var(--cur);transform:scale(1.1);box-shadow:0 0 0 3px #BFDBFE}
.sq.ok{background:var(--ok)}
.sq.wr{background:var(--bad)}
.sq.un{background:#D9A21B}
.sq.curR{box-shadow:0 0 0 3px var(--cur)}
.sq .fl{position:absolute;top:-9px;left:-6px;font-size:.8rem}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:.78rem;color:var(--mute);margin-bottom:10px;font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:4px;vertical-align:-1px}

.qno{text-align:center;font-weight:900;color:var(--p1);margin-bottom:8px;font-size:1.05rem}
.qno span{background:var(--pS);border-radius:30px;padding:3px 16px;display:inline-block}

/* question card */
.badge{display:inline-block;color:#fff;font-weight:800;font-size:.85rem;border-radius:30px;padding:3px 14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.stem{font-size:1.22rem;font-weight:800;margin:0 0 14px;color:var(--ink);line-height:1.85}
.h-r{color:#C8102E;font-weight:900}
.h-g{color:var(--sage);font-weight:900}
.h-b{color:#1D4ED8;font-weight:900}
.fig{text-align:center;margin:0 0 14px}
.fig img{max-width:100%;max-height:260px;border-radius:14px;border:3px solid var(--pS);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;text-align:right;border:2px solid #F4B6C8;background:var(--pXS);color:var(--ink);border-radius:14px;padding:11px 12px;font-size:1.08rem;font-weight:700;transition:transform .12s,background .15s}
.opt:active{transform:scale(.98)}
.opt .lt{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--p3),var(--p2))}
.opt.sel{background:#FFD3E0;border-color:var(--p2);box-shadow:0 0 0 3px rgba(229,56,107,.25)}
.opt.sel .lt{background:linear-gradient(135deg,var(--p1),#4C0E22)}
.opt.correct{background:var(--okL)!important;border-color:var(--ok)!important}
.opt.correct .lt{background:var(--ok)!important}
.opt.wrong{background:var(--badL)!important;border-color:var(--bad)!important}
.opt.wrong .lt{background:var(--bad)!important}
.opt .tag{margin-right:auto;font-size:.8rem;font-weight:800;border-radius:20px;padding:1px 9px;color:#fff}
.opt.correct .tag{background:var(--ok)}
.opt.wrong .tag{background:var(--bad)}
.exp{margin-top:14px;background:linear-gradient(135deg,#FFF8E1,#FFEFC2);border:2px solid #F2C04D;border-radius:14px;padding:11px 13px;font-weight:700;color:#6B4400}
.exp b{color:#9A5B05}
.note{margin-top:10px;font-weight:800;border-radius:12px;padding:7px 12px;text-align:center}
.note.un{background:var(--amberL);color:var(--amber)}
.note.ok{background:var(--okL);color:var(--ok)}
.note.wr{background:var(--badL);color:var(--bad)}

/* controls */
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.cb{border:none;border-radius:14px;padding:12px 6px;font-size:1rem;font-weight:900;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.cb:disabled{opacity:.4}
.cb.pv{background:linear-gradient(135deg,#5B8C2A,var(--sage))}
.cb.nx{background:linear-gradient(135deg,var(--p3),var(--p2))}
.cb.fg{background:linear-gradient(135deg,#F2B33D,#C77A0A)}
.cb.fg.on{background:linear-gradient(135deg,#B45309,#7C2D12)}
.cb.end{grid-column:1/-1;background:linear-gradient(135deg,#4C0E22,var(--p1));padding:14px}
.cb.back{grid-column:1/-1;background:linear-gradient(135deg,#0E8A7B,#0B5E55);padding:14px}

/* results */
.res{text-align:center}
.res h2{margin:0 0 10px;color:var(--p1);font-weight:900}
.ring{position:relative;width:180px;height:180px;margin:0 auto 6px}
.ring svg{transform:rotate(-90deg)}
.ring .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pc b{font-size:2.3rem;font-weight:900;line-height:1}
.ring .pc span{font-weight:800;color:var(--mute);font-size:.95rem;margin-top:4px}
.rate{display:inline-block;color:#fff;font-weight:900;font-size:1.15rem;border-radius:30px;padding:4px 20px;margin:6px 0}
.msg{font-weight:700;color:var(--mute);margin:4px 0 14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.st{border:none;border-radius:16px;padding:10px 6px;color:#fff;font-weight:800;font-size:.95rem;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.st b{display:block;font-size:1.6rem;font-weight:900;line-height:1.3}
.st.c{background:linear-gradient(135deg,#22A04B,var(--ok))}
.st.w{background:linear-gradient(135deg,#EF4444,#B91C1C)}
.st.u{background:linear-gradient(135deg,#E8A33D,#B7791F)}
.st.t{background:linear-gradient(135deg,#3B82F6,#1D4ED8);cursor:default}
.st.act{outline:4px solid rgba(0,0,0,.18)}
.st .tt{direction:ltr;unicode-bidi:isolate;display:inline-block}
.lst{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:0 0 12px;padding:10px;border-radius:14px}
.lst.c{background:var(--okL)}.lst.w{background:var(--badL)}.lst.u{background:var(--amberL)}
.lst button{border:none;border-radius:10px;min-width:38px;height:38px;font-weight:900;color:#fff;font-size:1rem}
.lst.c button{background:var(--ok)}.lst.w button{background:var(--bad)}.lst.u button{background:#D9A21B}
.lst .em{font-weight:800;padding:4px}
.lst.c .em{color:var(--ok)}.lst.w .em{color:var(--bad)}.lst.u .em{color:var(--amber)}
.secRep{display:grid;gap:6px;margin:6px 0 14px;text-align:right}
.secRep div{display:flex;justify-content:space-between;color:#fff;border-radius:12px;padding:6px 12px;font-weight:800;font-size:.92rem}
.hd2{font-weight:900;color:var(--p1);margin:10px 0 6px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
#inlBox,#navg{scroll-margin-top:90px}
.inl{margin:6px 0 14px;text-align:right;border:2px dashed var(--p3);background:#fff}
.inl .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.inl .ih b{color:var(--p1);font-weight:900}
.inl .x{border:none;background:var(--p2);color:#fff;border-radius:50%;width:32px;height:32px;font-weight:900}
.rbtns{display:grid;gap:8px}
.rb{border:none;border-radius:14px;padding:13px;font-size:1.05rem;font-weight:900;color:#fff}
.rb.rv{background:linear-gradient(135deg,#0E8A7B,#0B5E55)}
.rb.rs{background:linear-gradient(135deg,var(--p2),var(--p1))}

/* modal */
.mdl{position:fixed;inset:0;background:rgba(40,8,20,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.mdl .box{background:#fff;border-radius:20px;padding:20px 18px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mdl h3{margin:0 0 6px;color:var(--p1);font-weight:900}
.mdl p{margin:0 0 14px;font-weight:700;color:var(--mute)}
.mdl .bs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mdl .y{background:linear-gradient(135deg,#4C0E22,var(--p1))}
.mdl .n{background:linear-gradient(135deg,#5B8C2A,var(--sage))}

/* footer */
.ftr{text-align:center;padding:18px 14px 28px;color:var(--p1)}
.ftr .lg{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.ftr .lg .ic{width:38px;height:38px}
.ftr .lg .wd{height:32px;width:auto}
.ftr .attr{font-size:1.1rem}

@media (min-width:480px){.opts{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)}}
@media (max-width:360px){.stem{font-size:1.08rem}.opt{font-size:.98rem;padding:9px}.sq{width:32px;height:32px;font-size:.85rem}.cb{font-size:.9rem}.hdr .ttl{font-size:1.3rem}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.qc,.inl{animation:pop .25s ease}
</style>
</head>

<main>
  <section id="intro" class="card intro">
    <h2>اختبار ١ دراسة الحياة</h2>
    <p>اقرأ كل سؤال جيداً، ثم اختر الإجابة الصحيحة.</p>
    <div class="chips" id="chips"></div>
    <div class="secs" id="secs"></div>
    <button class="big" id="startBtn">ابدأ الاختبار ◀</button>
  </section>

  <section id="quiz" class="hide">
    <div class="navg" id="navg"></div>
    <div class="legend" id="legend"></div>
    <div class="qno" id="qno"></div>
    <div class="card qc" id="qcard"></div>
    <div class="ctl">
      <button class="cb pv" id="prevBtn">السابق ▶</button>
      <button class="cb fg" id="flagBtn">تميز للمراجعة</button>
      <button class="cb nx" id="nextBtn">◀ التالي</button>
      <button class="cb end" id="endBtn">إنهاء الاختبار</button>
      <button class="cb back hide" id="backBtn">🏁 العودة للنتيجة</button>
    </div>
  </section>

  <section id="result" class="card res hide"></section>
</main>

  <p id="mdlTxt"></p>

function hl(s){ return s.replace(/\{([rgb]):([^}]*)\}/g, function(m,c,t){ return '<bdi class="h-'+c+'">'+t+'<\/bdi>'; }); }
function $(id){ return document.getElementById(id); }
function fmt(sec){ var m = Math.floor(sec/60), s = sec%60; return ar((m<10?'0':'')+m) + ':' + ar((s<10?'0':'')+s); }
function on(el, ev, fn){ el.addEventListener(ev, fn, false); }

function init(){
  ans = []; flags = [];
  for (var i=0;i<N;i++){ ans.push(null); flags.push(false); }
  cur = 0; quizEnded = false; remain = total; elapsed = 0; openList = null;
  var cnt = {}; for (var j=0;j<N;j++){ cnt[Q[j].s] = (cnt[Q[j].s]||0) + 1; }
  $('chips').innerHTML = '<span class="chip">📋 '+ar(N)+' سؤالاً</span><span class="chip a">⏱ '+ar(N+1)+' دقيقة</span><span class="chip g">🧬 '+ar(S.length)+' أقسام</span>';
  var h = '';
  for (var k=0;k<S.length;k++){ h += '<div class="'+S[k].cls+'"><span>'+S[k].name+'</span><b>'+ar(cnt[k]||0)+'</b></div>'; }
  $('secs').innerHTML = h;
  $('legend').innerHTML = '<span><i style="background:var(--bad)"></i>بدون إجابة</span><span><i style="background:var(--ok)"></i>تمت الإجابة</span><span><i style="background:var(--cur)"></i>السؤال الحالي</span><span>🚩 للمراجعة</span>';
}

function start(){
  $('intro').classList.add('hide'); $('result').classList.add('hide');
  $('quiz').classList.remove('hide'); $('stk').classList.remove('hide');
  $('endBtn').classList.remove('hide'); $('backBtn').classList.add('hide'); $('flagBtn').classList.remove('hide');
  $('tmr').classList.remove('hide');
  t0 = Date.now(); tick();
  if (tId) clearInterval(tId);
  tId = setInterval(tick, 1000);
  render(); window.scrollTo(0,0);
}

function tick(){
  if (quizEnded) return;
  elapsed = Math.min(total, Math.round((Date.now()-t0)/1000));
  remain = total - elapsed;
  $('tm').innerHTML = fmt(remain);
  var t = $('tmr'); t.classList.toggle('warn', remain <= 300 && remain > 60); t.classList.toggle('crit', remain <= 60);
  if (remain <= 0) { finish(); }
}

function answeredCount(){ var c=0; for (var i=0;i<N;i++) if (ans[i]!==null) c++; return c; }
function progress(){
  var a = answeredCount();
  $('pgA').innerHTML = 'تمت الإجابة: '+ar(a)+' من '+ar(N);
  $('pgB').innerHTML = ar(Math.round(a*100/N))+'٪';
  $('pgBar').style.width = (a*100/N)+'%';
}

function renderNav(){
  var h = '';
  for (var i=0;i<N;i++){
    var c = 'sq ';
    if (!quizEnded){ c += (i===cur) ? 'cur' : (ans[i]!==null ? 'ans' : 'no'); }
    else { c += ans[i]===null ? 'un' : (ans[i]===Q[i].c ? 'ok' : 'wr'); if (i===cur) c += ' curR'; }
    h += '<button class="'+c+'" data-i="'+i+'">'+ar(i+1)+(flags[i]?'<span class="fl">🚩<\/span>':'')+'<\/button>';
  }
  $('navg').innerHTML = h;
  if (quizEnded) $('legend').innerHTML = '<span><i style="background:var(--ok)"></i>صحيحة</span><span><i style="background:var(--bad)"></i>خاطئة</span><span><i style="background:#D9A21B"></i>بدون إجابة</span><span>🚩 للمراجعة</span>';
}

function cardHTML(i, review){
  var q = Q[i], sec = S[q.s], h = '';
  h += '<span class="badge '+sec.cls+'">'+sec.badge+'<\/span>';
  h += '<p class="stem">'+hl(q.q)+'<\/p>';
  if (q.img) h += '<div class="fig"><img alt="شكل السؤال" src="'+IMG[q.img]+'"><\/div>';
  h += '<div class="opts">';
  for (var k=0;k<q.o.length;k++){
    var cls = 'opt', tag = '';
    if (review){
      if (k===q.c){ cls += ' correct'; tag = '<span class="tag">✔ الصحيحة<\/span>'; }
      else if (ans[i]===k){ cls += ' wrong'; tag = '<span class="tag">✘ إجابتك<\/span>'; }
      if (k===q.c && ans[i]===k) tag = '<span class="tag">✔ إجابتك<\/span>';
    } else if (ans[i]===k) cls += ' sel';
    h += '<button class="'+cls+'" data-k="'+k+'"><span class="lt">'+LET[k]+'<\/span><span>'+hl(q.o[k])+'<\/span>'+tag+'<\/button>';
  }
  h += '<\/div>';
  if (review){
    if (ans[i]===null) h += '<div class="note un">⚠️ لم تتم الإجابة عن هذا السؤال<\/div>';
    else if (ans[i]===q.c) h += '<div class="note ok">✅ إجابة صحيحة<\/div>';
    else h += '<div class="note wr">❌ إجابة خاطئة<\/div>';
    h += '<div class="exp">💡 <b>التوضيح:<\/b> '+hl(q.e)+'<\/div>';
  }
  return h;
}

function showAnswerColors(){ $('qcard').innerHTML = cardHTML(cur, true); }

function render(){
  $('qno').innerHTML = '<span>السؤال رقم '+ar(cur+1)+' من '+ar(N)+'<\/span>';
  if (quizEnded) showAnswerColors(); else $('qcard').innerHTML = cardHTML(cur, false);
  var c = $('qcard'); c.classList.remove('qc'); void c.offsetWidth; c.classList.add('qc');
  $('prevBtn').disabled = cur===0; $('nextBtn').disabled = cur===N-1;
  var f = $('flagBtn'); f.classList.toggle('on', flags[cur]); f.innerHTML = flags[cur] ? '🚩 إلغاء التمييز' : 'تميز للمراجعة';
  renderNav(); progress();
}

function go(i){ if (i<0||i>=N) return; cur = i; render(); var n = $('navg'); if (n.getBoundingClientRect().top < 0) n.scrollIntoView({behavior:'smooth', block:'start'}); }

function askEnd(){
  var u = N - answeredCount();
  $('mdlTxt').innerHTML = u>0 ? ('لديك '+ar(u)+' سؤال بدون إجابة. هل تريد إنهاء الاختبار؟') : 'أجبت عن جميع الأسئلة. هل تريد إنهاء الاختبار وعرض النتيجة؟';
  $('mdl').classList.remove('hide');
}

function finish(){
  if (quizEnded) return;
  quizEnded = true; clearInterval(tId);
  elapsed = Math.min(total, Math.round((Date.now()-t0)/1000));
  $('mdl').classList.add('hide'); $('tmr').classList.add('hide');
  $('endBtn').classList.add('hide'); $('flagBtn').classList.add('hide'); $('backBtn').classList.remove('hide');
  showResult();
}

function ringColor(p){
  if (p < 60){ var s = 90 - (p/60)*55; var l = 48 + (p/60)*14; return 'hsl(0,'+s+'%,'+l+'%)'; }
  var s2 = 40 + ((p-60)/40)*48; var l2 = 58 - ((p-60)/40)*20; return 'hsl(135,'+s2+'%,'+l2+'%)';
}

function lists(){
  var c=[],w=[],u=[];
  for (var i=0;i<N;i++){ if (ans[i]===null) u.push(i); else if (ans[i]===Q[i].c) c.push(i); else w.push(i); }
  return {c:c,w:w,u:u};
}

function showResult(){
  $('quiz').classList.add('hide'); $('result').classList.remove('hide');
  var L = lists(), cc = L.c.length, p = Math.round(cc*100/N);
  var rate, rc, msg;
  if (p>=90){ rate='ممتاز'; rc='linear-gradient(135deg,#22A04B,#15803D)'; msg='أداء رائع! أنت متمكن من دراسة الحياة 🌟'; }
  else if (p>=80){ rate='جيد جدًا'; rc='linear-gradient(135deg,#5B8C2A,#3F6B1E)'; msg='مستوى قوي، راجع أخطاءك القليلة لتصل للتميز 💪'; }
  else if (p>=70){ rate='جيد'; rc='linear-gradient(135deg,#0E8A7B,#0B5E55)'; msg='بداية جيدة، مراجعة المصطلحات سترفع درجتك 📘'; }
  else if (p>=60){ rate='يحتاج مراجعة'; rc='linear-gradient(135deg,#E8A33D,#B7791F)'; msg='راجع خصائص الحياة وخطوات الطريقة العلمية ثم أعد المحاولة 🔁'; }
  else { rate='يحتاج مذاكرة'; rc='linear-gradient(135deg,#EF4444,#B91C1C)'; msg='ذاكر الدرس جيداً ثم أعد الاختبار، أنت قادر 🌱'; }
  var R = 76, C = 2*Math.PI*R, col = ringColor(p);
  var h = '<h2>🏁 نتيجة الاختبار<\/h2>';
  h += '<div class="ring"><svg width="180" height="180" viewBox="0 0 180 180"><circle cx="90" cy="90" r="'+R+'" fill="none" stroke="#FBE3EA" stroke-width="16"/><circle id="rg" cx="90" cy="90" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" style="transition:stroke-dashoffset 1.2s ease"/><\/svg>';
  h += '<div class="pc"><b style="color:'+col+'">'+ar(p)+'٪<\/b><span>'+ar(cc)+' من '+ar(N)+'<\/span><\/div><\/div>';
  h += '<div class="rate" style="background:'+rc+'">'+rate+'<\/div><div class="msg">'+msg+'<\/div>';
  h += '<div class="stats"><button class="st c" data-l="c"><b>'+ar(cc)+'<\/b>صحيح<\/button><button class="st w" data-l="w"><b>'+ar(L.w.length)+'<\/b>خطأ<\/button><button class="st u" data-l="u"><b>'+ar(L.u.length)+'<\/b>بدون إجابة<\/button><div class="st t"><b class="tt">'+fmt(elapsed)+'<\/b>الوقت<\/div><\/div>';
  h += '<div id="lstBox"><\/div><div id="inlBox"><\/div>';
  h += '<div class="hd2">📊 النتيجة حسب الأقسام<\/div><div class="secRep">';
  for (var k=0;k<S.length;k++){
    var t=0, g=0; for (var i=0;i<N;i++) if (Q[i].s===k){ t++; if (ans[i]===Q[i].c) g++; }
    h += '<div class="'+S[k].cls+'"><span>'+S[k].name+'<\/span><span>'+ar(g)+' من '+ar(t)+'<\/span><\/div>';
  }
  h += '<\/div><div class="hd2">🔎 اضغط على أي سؤال لعرض التوضيح<\/div><div class="dots" id="rdots">';
  for (var j=0;j<N;j++){ var dc = ans[j]===null ? 'un' : (ans[j]===Q[j].c ? 'ok' : 'wr'); h += '<button class="sq '+dc+'" data-q="'+j+'">'+ar(j+1)+(flags[j]?'<span class="fl">🚩<\/span>':'')+'<\/button>'; }
  h += '<\/div><div class="rbtns"><button class="rb rv" id="revBtn">📖 مراجعة الأسئلة بالترتيب<\/button><button class="rb rs" id="rstBtn">🔄 إعادة الاختبار<\/button><\/div>';
  $('result').innerHTML = h;
  window.scrollTo(0,0);
  setTimeout(function(){ var r = $('rg'); if (r) r.style.strokeDashoffset = C*(1-p/100); }, 60);
  if (openList) showList(openList);
}

function showList(l){
  openList = l;
  var L = lists(), arr = L[l], h = '<div class="lst '+l+'">';
  var bs = document.querySelectorAll('.st[data-l]'); for (var i=0;i<bs.length;i++) bs[i].classList.toggle('act', bs[i].getAttribute('data-l')===l);
  if (!arr.length){
    if (l==='w') h += '<span class="em">'+(L.c.length===N ? 'لا توجد أخطاء 🎉' : 'لم تُسجَّل إجابات خاطئة، لكن توجد أسئلة بدون إجابة ⚠️')+'<\/span>';
    else if (l==='u') h += '<span class="em">أجبت عن جميع الأسئلة 👏<\/span>';
    else h += '<span class="em">لا توجد إجابات صحيحة بعد — راجع الدرس وأعد المحاولة 📘<\/span>';
  }
  for (var j=0;j<arr.length;j++) h += '<button data-q="'+arr[j]+'">'+ar(arr[j]+1)+'<\/button>';
  $('lstBox').innerHTML = h + '<\/div>';
}

function showInline(i){
  $('inlBox').innerHTML = '<div class="card inl"><div class="ih"><b>السؤال رقم '+ar(i+1)+' من '+ar(N)+'<\/b><button class="x" id="inlX">✕<\/button><\/div>'+cardHTML(i, true)+'<\/div>';
  $('inlBox').scrollIntoView({behavior:'smooth', block:'start'});
}

/* events */
on($('startBtn'),'click',start);
on($('prevBtn'),'click',function(){ go(cur-1); });
on($('nextBtn'),'click',function(){ go(cur+1); });
on($('flagBtn'),'click',function(){ flags[cur] = !flags[cur]; render(); });
on($('endBtn'),'click',askEnd);
on($('mdlY'),'click',finish);
on($('mdlN'),'click',function(){ $('mdl').classList.add('hide'); });
on($('backBtn'),'click',function(){ showResult(); });
on($('navg'),'click',function(e){ var b = e.target.closest('.sq'); if (b) go(+b.getAttribute('data-i')); });
on($('qcard'),'click',function(e){
  if (quizEnded) return;
  var b = e.target.closest('.opt'); if (!b) return;
  ans[cur] = +b.getAttribute('data-k'); render();
});
on($('result'),'click',function(e){
  var t = e.target;
  var st = t.closest('.st[data-l]'); if (st){ showList(st.getAttribute('data-l')); return; }
  var qb = t.closest('[data-q]'); if (qb){ showInline(+qb.getAttribute('data-q')); return; }
  if (t.closest('#inlX')){ $('inlBox').innerHTML = ''; return; }
  if (t.closest('#revBtn')){ $('result').classList.add('hide'); $('quiz').classList.remove('hide'); cur = 0; render(); window.scrollTo(0,0); return; }
  if (t.closest('#rstBtn')){ init(); start(); }
});
init();
</script>
</body>
</html>
